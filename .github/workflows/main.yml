name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          unzip -o VocabShock.zip && cd VocabShock
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/g.zip
          sudo unzip -q -o /tmp/g.zip -d /opt
          sudo /opt/gradle-8.2/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: VocabShock-debug, path: VocabShock/app/build/outputs/apk/debug/app-debug.apk}
